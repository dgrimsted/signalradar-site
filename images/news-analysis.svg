<svg xmlns="http://www.w3.org/2000/svg" width="400" height="700" viewBox="0 0 400 700">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Phone frame -->
  <rect x="10" y="10" width="380" height="680" rx="24" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)"/>
  <!-- Status bar -->
  <rect x="10" y="10" width="380" height="36" rx="24" fill="white"/>
  <!-- Header -->
  <rect x="10" y="46" width="380" height="44" fill="white"/>
  <text x="30" y="74" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#632CA6">Signal</text>
  <text x="82" y="74" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#2E2E38">Radar</text>
  <text x="160" y="74" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6A6A78">News that impacts your forecast</text>
  <!-- Dropdown -->
  <rect x="20" y="100" width="240" height="32" rx="4" fill="white" stroke="#dee2e6"/>
  <text x="30" y="121" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#2E2E38">G-X Lithium ETF</text>
  <!-- Buttons -->
  <rect x="280" y="100" width="48" height="32" rx="4" fill="#632CA6"/>
  <text x="289" y="120" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="white">Analysis</text>
  <rect x="334" y="100" width="48" height="32" rx="4" fill="#34D399"/>
  <text x="347" y="120" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="white">News</text>
  <!-- Title -->
  <text x="200" y="160" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="600" fill="#2E2E38">G-X Lithium ETF</text>
  <text x="30" y="178" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#9CA3AF">Forecast Period: 01/01/26</text>
  <!-- Three forecast boxes -->
  <rect x="20" y="190" width="110" height="50" rx="4" fill="#f8f9fa" stroke="#e5e7eb"/>
  <text x="75" y="207" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">Your Internal Forecast</text>
  <text x="75" y="228" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" fill="#2E2E38">47.95</text>
  <polygon points="140,215 155,210 155,220" fill="#60A5FA"/>
  <rect x="145" y="190" width="110" height="50" rx="4" fill="#f8f9fa" stroke="#e5e7eb"/>
  <text x="200" y="207" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">Market Signal Enhanced</text>
  <text x="200" y="228" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" fill="#2E2E38">48.93</text>
  <polygon points="265,215 280,210 280,220" fill="#60A5FA"/>
  <rect x="270" y="190" width="110" height="50" rx="4" fill="#632CA6"/>
  <text x="325" y="207" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="rgba(255,255,255,0.8)">News Enhanced Forecast</text>
  <text x="325" y="228" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" fill="white">49.91</text>
  <!-- Articles header -->
  <rect x="20" y="260" width="360" height="36" rx="4" fill="#1a8a6a"/>
  <text x="200" y="283" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600" fill="white">Articles that are having an Upward impact</text>
  <!-- Article list header -->
  <rect x="20" y="296" width="360" height="24" fill="#f8f9fa" stroke="#e5e7eb"/>
  <text x="40" y="312" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" font-weight="600" fill="#6A6A78">Publish Date</text>
  <text x="160" y="312" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" font-weight="600" fill="#6A6A78">Article Headline</text>
  <text x="350" y="312" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" font-weight="600" fill="#6A6A78">Risk Score</text>
  <!-- Article rows -->
  <rect x="20" y="320" width="360" height="40" fill="white" stroke="#f3f4f6"/>
  <text x="40" y="344" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#6A6A78">10/29/25</text>
  <text x="100" y="336" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">Lithium Prices Boosted by China's</text>
  <text x="100" y="350" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">Policy Drive - Bloomberg.com</text>
  <text x="350" y="340" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700" fill="#34D399">85</text>
  <rect x="20" y="360" width="360" height="40" fill="white" stroke="#f3f4f6"/>
  <text x="40" y="384" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#6A6A78">10/29/25</text>
  <text x="100" y="376" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">4% rise in industrial production</text>
  <text x="100" y="390" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">during Sept - The Hans India</text>
  <text x="350" y="380" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700" fill="#34D399">75</text>
  <!-- Explanation box -->
  <rect x="20" y="410" width="360" height="36" rx="4" fill="#e74c3c"/>
  <text x="200" y="433" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600" fill="white">Up or Down Explanation</text>
  <rect x="20" y="446" width="360" height="80" rx="0 0 4 4" fill="white" stroke="#e5e7eb"/>
  <text x="30" y="465" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">The expansion of Lynas Rare Earths Ltd. to</text>
  <text x="30" y="478" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">increase processing capacity for heavy rare earths</text>
  <text x="30" y="491" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">indicates a strengthening supply chain for critical</text>
  <text x="30" y="504" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">materials, which could positively impact demand...</text>
  <!-- More article rows -->
  <rect x="20" y="536" width="360" height="40" fill="white" stroke="#f3f4f6"/>
  <text x="40" y="560" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#6A6A78">10/29/25</text>
  <text x="100" y="552" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">AI fuels tech rally; Apple touches</text>
  <text x="100" y="566" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">$4 trillion - Economic Times</text>
  <text x="350" y="556" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700" fill="#34D399">75</text>
  <rect x="20" y="576" width="360" height="40" fill="white" stroke="#f3f4f6"/>
  <text x="40" y="600" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#6A6A78">10/29/25</text>
  <text x="100" y="592" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">Stock Market News: Nasdaq Rallies</text>
  <text x="100" y="606" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">to Record - Wall Street Journal</text>
  <text x="350" y="596" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700" fill="#34D399">75</text>
  <rect x="20" y="616" width="360" height="40" fill="white" stroke="#f3f4f6"/>
  <text x="40" y="640" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#6A6A78">10/29/25</text>
  <text x="100" y="632" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">CNBC Daily Open: Rallies and tech</text>
  <text x="100" y="646" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#2E2E38">'revolution' powered by AI - CNBC</text>
  <text x="350" y="636" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700" fill="#34D399">75</text>
</svg>
