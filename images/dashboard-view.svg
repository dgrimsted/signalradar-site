<svg xmlns="http://www.w3.org/2000/svg" width="400" height="700" viewBox="0 0 400 700">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#632CA6"/>
      <stop offset="100%" stop-color="#7B42BC"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Phone frame -->
  <rect x="10" y="10" width="380" height="680" rx="24" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)"/>
  <!-- Status bar -->
  <rect x="10" y="10" width="380" height="36" rx="24" fill="white"/>
  <!-- Header -->
  <rect x="10" y="46" width="380" height="44" fill="white"/>
  <text x="30" y="74" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#632CA6">Signal</text>
  <text x="82" y="74" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#2E2E38">Radar</text>
  <text x="160" y="74" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6A6A78">News that impacts your forecast</text>
  <!-- Dropdown -->
  <rect x="20" y="100" width="240" height="32" rx="4" fill="white" stroke="#dee2e6"/>
  <text x="30" y="121" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#2E2E38">Baltic Dry Index</text>
  <!-- Analysis/News buttons -->
  <rect x="280" y="100" width="48" height="32" rx="4" fill="#632CA6"/>
  <text x="289" y="120" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="white">Analysis</text>
  <rect x="334" y="100" width="48" height="32" rx="4" fill="#34D399"/>
  <text x="347" y="120" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="white">News</text>
  <!-- Title -->
  <text x="200" y="160" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="600" fill="#2E2E38">Baltic Dry Index</text>
  <text x="30" y="178" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" fill="#9CA3AF">Forecast Period: 01/01/26</text>
  <!-- Three forecast boxes -->
  <rect x="20" y="190" width="110" height="50" rx="4" fill="#f8f9fa" stroke="#e5e7eb"/>
  <text x="75" y="207" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">Your Internal Forecast</text>
  <text x="75" y="228" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" fill="#2E2E38">1,876.89</text>
  <!-- Arrow -->
  <polygon points="140,215 155,210 155,220" fill="#60A5FA"/>
  <rect x="145" y="190" width="110" height="50" rx="4" fill="#f8f9fa" stroke="#e5e7eb"/>
  <text x="200" y="207" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">Market Signal Enhanced</text>
  <text x="200" y="228" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" fill="#2E2E38">1,915.20</text>
  <!-- Arrow -->
  <polygon points="265,215 280,210 280,220" fill="#60A5FA"/>
  <rect x="270" y="190" width="110" height="50" rx="4" fill="#632CA6"/>
  <text x="325" y="207" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="rgba(255,255,255,0.8)">News Enhanced Forecast</text>
  <text x="325" y="228" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" fill="white">1,953.50</text>
  <!-- Chart area -->
  <rect x="20" y="260" width="360" height="180" rx="4" fill="white" stroke="#e5e7eb"/>
  <text x="30" y="280" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" font-weight="600" fill="#2E2E38">Forecasts Trend Analysis</text>
  <!-- Chart legend -->
  <line x1="180" y1="276" x2="195" y2="276" stroke="#60A5FA" stroke-width="2"/>
  <text x="198" y="279" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">Your Forecast</text>
  <line x1="260" y1="276" x2="275" y2="276" stroke="#34D399" stroke-width="2"/>
  <text x="278" y="279" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">Market Signal</text>
  <!-- Chart lines (simplified) -->
  <polyline points="30,320 60,315 90,310 120,315 150,312 180,318 210,310 240,305 270,310 300,315 330,312 360,310" fill="none" stroke="#60A5FA" stroke-width="2"/>
  <polyline points="30,320 60,325 90,340 120,355 150,370 180,385 210,395 240,400 270,402 300,404 330,405 360,405" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="6,3"/>
  <polyline points="30,320 60,323 90,335 120,350 150,362 180,378 210,388 240,392 270,394 300,395 330,395 360,396" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <!-- NOW line -->
  <line x1="210" y1="290" x2="210" y2="430" stroke="#374151" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="210" y="288" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" font-weight="700" fill="#374151">NOW</text>
  <!-- Influence section -->
  <rect x="20" y="460" width="360" height="220" rx="4" fill="white" stroke="#e5e7eb"/>
  <text x="200" y="485" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" font-weight="600" fill="#2E2E38">What forces are influencing the forecast?</text>
  <!-- Bar chart rows -->
  <text x="130" y="510" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">CHEMICALS STOCKS</text>
  <rect x="135" y="502" width="120" height="12" rx="2" fill="#34D399"/>
  <text x="130" y="530" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">RETAILERS STOCKS</text>
  <rect x="135" y="522" width="100" height="12" rx="2" fill="#34D399"/>
  <text x="130" y="550" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">FINANCIAL SERVICES</text>
  <rect x="135" y="542" width="90" height="12" rx="2" fill="#34D399"/>
  <text x="130" y="570" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">METALS COMMODITIES</text>
  <rect x="135" y="562" width="80" height="12" rx="2" fill="#34D399"/>
  <text x="130" y="590" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">TRAVEL &amp; LEISURE</text>
  <rect x="135" y="582" width="70" height="12" rx="2" fill="#34D399"/>
  <text x="130" y="610" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">WORKING AGE POP.</text>
  <rect x="135" y="602" width="55" height="12" rx="2" fill="#34D399"/>
  <text x="130" y="630" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">BASIC MATERIALS</text>
  <rect x="135" y="622" width="45" height="12" rx="2" fill="#34D399"/>
  <text x="130" y="650" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">OIL &amp; GAS STOCKS</text>
  <rect x="135" y="642" width="35" height="12" rx="2" fill="#34D399"/>
  <text x="130" y="670" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="7" fill="#6A6A78">HOUSING INVENTORY</text>
  <rect x="135" y="662" width="30" height="12" rx="2" fill="#34D399"/>
</svg>
